name: scheduled-job

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.db
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
          SOURCE_A: ${{ secrets.SOURCE_A }}
          SOURCE_B: ${{ secrets.SOURCE_B }}
          SOURCE_C: ${{ secrets.SOURCE_C }}
          SOURCE_D: ${{ secrets.SOURCE_D }}
          TOPIC_A: ${{ secrets.TOPIC_A }}
          TOPIC_B: ${{ secrets.TOPIC_B }}
        run: |
          cd src
          python main.py

      - name: Save state
        uses: actions/cache/save@v4
        with:
          path: state.db
          key: state-${{ github.run_id }}
