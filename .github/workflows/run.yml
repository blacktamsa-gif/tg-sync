name: Telegram Scheduled Video Processor

on:
  # ==========================================================
  # 매시간 10분에 실행
  #
  # GitHub Actions cron은 UTC 기준
  #
  # "10 * * * *"
  # = 매시간 10분
  #
  # KST에서도 매시간 10분에 해당한다.
  # ==========================================================
  schedule:
    - cron: "10 * * * *"

  # GitHub Actions 화면에서 수동 실행 가능
  workflow_dispatch:


# ==========================================================
# 중복 실행 방지
# ==========================================================

concurrency:
  group: telegram-video-processor
  cancel-in-progress: false


jobs:

  run:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ======================================================
      # Restore SQLite processing database
      #
      # 중요:
      #
      # main.py 실행 시:
      #
      #     cd src
      #     python main.py
      #
      # 이므로 database.py가 state.db를 만들면
      # 실제 위치는:
      #
      #     src/state.db
      #
      # 따라서 cache path도 src/state.db여야 한다.
      # ======================================================

      - name: Restore processing database
        uses: actions/cache/restore@v5
        with:
          path: src/state.db

          # 현재 실행은 고유한 cache key를 사용
          # 이전 실행의 cache는 restore-keys로 검색
          key: telegram-state-${{ github.ref_name }}-${{ github.run_id }}

          restore-keys: |
            telegram-state-${{ github.ref_name }}-


      # ======================================================
      # Install dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # Run Telegram processor
      # ======================================================

      - name: Run Telegram processor
        env:

          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}

          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}

          SOURCE_A: ${{ secrets.SOURCE_A }}
          SOURCE_B: ${{ secrets.SOURCE_B }}
          SOURCE_C: ${{ secrets.SOURCE_C }}
          SOURCE_D: ${{ secrets.SOURCE_D }}

          TOPIC_A: ${{ secrets.TOPIC_A }}
          TOPIC_B: ${{ secrets.TOPIC_B }}

        run: |

          echo "=========================================="
          echo "Starting Telegram processor"
          echo "=========================================="

          echo "UTC time:"
          date -u

          echo "KST time:"
          TZ=Asia/Seoul date

          echo "=========================================="

          cd src

          python main.py


      # ======================================================
      # Save SQLite processing database
      #
      # 중요:
      #
      # 실제 DB 위치가 src/state.db이므로
      # 반드시 같은 경로를 사용한다.
      # ======================================================

      - name: Save processing database
        uses: actions/cache/save@v5
        with:
          path: src/state.db
          key: telegram-state-${{ github.ref_name }}-${{ github.run_id }}
