name: Telegram Scheduled Video Processor

on:
  schedule:
    - cron: "10 * * * *"

  workflow_dispatch:


concurrency:
  group: telegram-video-processor
  cancel-in-progress: false


jobs:

  run:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ======================================================
      # Prepare directories
      # ======================================================

      - name: Prepare directories
        run: |
          mkdir -p src


      # ======================================================
      # Restore processing database
      # ======================================================

      - name: Restore processing database
        uses: actions/cache/restore@v5
        with:
          path: src/state.db
          key: telegram-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            telegram-state-${{ github.ref_name }}-


      # ======================================================
      # Install dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # Run Telegram processor
      # ======================================================

      - name: Run Telegram processor
        env:

          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}

          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}

          SOURCE_A: ${{ secrets.SOURCE_A }}
          SOURCE_B: ${{ secrets.SOURCE_B }}
          SOURCE_C: ${{ secrets.SOURCE_C }}
          SOURCE_D: ${{ secrets.SOURCE_D }}

          TOPIC_A: ${{ secrets.TOPIC_A }}
          TOPIC_B: ${{ secrets.TOPIC_B }}

        run: |

          echo "=========================================="
          echo "Starting Telegram processor"
          echo "=========================================="

          echo "UTC time:"
          date -u

          echo "KST time:"
          TZ=Asia/Seoul date

          echo "=========================================="

          python -m py_compile src/main.py
          python -m py_compile src/database.py

          cd src

          python main.py


      # ======================================================
      # Verify database
      # ======================================================

      - name: Verify processing database
        if: always()
        run: |

          echo "=========================================="
          echo "Database verification"
          echo "=========================================="

          if [ -f src/state.db ]; then

            echo "state.db exists."

            ls -lh src/state.db

          else

            echo "state.db does not exist."

            echo "This is acceptable if no video was successfully uploaded."

          fi


      # ======================================================
      # Save SQLite state
      # ======================================================

      - name: Save processing database
        if: always()
        uses: actions/cache/save@v5
        with:
          path: src/state.db
          key: telegram-state-${{ github.ref_name }}-${{ github.run_id }}
